nessus_transformer::scan_reports_source_address: "127.0.0.1"
nessus_transformer::scan_reports_source_port: 9000
nessus_transformer::scan_reports_source_protocol: "https"
nessus_transformer::scan_reports_source_insecure_ssl: true

---
