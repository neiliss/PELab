---
message: "This node is using common data"
puppet_enterprise::profile::console::rbac_session_timeout: 240
puppet_enterprise::profile::console::display_local_time: true
# The forge + bearer token are used ONLY by forgenano (to mirror the module
# catalog into the local forge).  They are deliberately NOT forced here for
# puppet/r10k – puppet and r10k must use whatever forge the control-repo
# Puppetfile declares.  allow_puppetfile_override keeps the Puppetfile's
# `forge` directive in control.
pe_r10k::forge_settings:
  allow_puppetfile_override: true
puppet_enterprise::master::code_manager::forge_settings:
  allow_puppetfile_override: true
#POD
#puppet_operational_dashboards::profile::dashboards::grafana_version: '12.3.0'
#puppet_operational_dashboards::enterprise_infrastructure::template_format: 'yaml'
